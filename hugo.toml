baseURL = 'https://dryg.github.io/'
languageCode = 'pl'
title = 'dryg'
disableKinds = ['taxonomy', 'term', 'RSS', 'section']

[params]
  description = 'Usługi hostowane przez dryg: PDF, narzędzia, powiadomienia ntfy i czytnik RSS.'

# Każda usługa to jeden blok [[params.services]].
# software jest opcjonalne — pokazuje się obok nazwy.
[[params.services]]
  name = 'PDF'
  url = 'https://pdf.dryg.eu'
  software = 'BentoPDF'
  description = 'Łączenie, dzielenie, kompresja i konwersja PDF. Pliki nie opuszczają przeglądarki.'

[[params.services]]
  name = 'Tools'
  url = 'https://tools.dryg.eu'
  description = 'Konwertery, generatory i kalkulatory dla programistów i administratorów.'

[[params.services]]
  name = 'ntfy'
  url = 'https://ntfy.dryg.eu'
  software = 'ntfy'
  description = 'Powiadomienia push na telefon i komputer wysyłane zwykłym zapytaniem HTTP.'

[[params.services]]
  name = 'RSS'
  url = 'https://rss.dryg.eu'
  software = 'FreshRSS'
  description = 'Czytnik kanałów RSS i Atom. Wszystkie subskrypcje w jednym miejscu, synchronizowane między urządzeniami.'
